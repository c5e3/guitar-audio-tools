; PlatformIO project configuration
[platformio]
default_envs = m5stickc_plus

[env:m5stickc_plus]
; M5StickC Plus 1.1 (ESP32-PICO-D4, AXP192, SPM1423 PDM microphone, buzzer).
; Arduino core 3.2.0 (ESP-IDF 5.4.1), the core the firmware was developed on.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stick-c
board_build.variant = m5stack_stickc_plus    ; the variant named in m5stick-c.json is gone in core 3.x
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.23     ; display, buttons, PDM microphone, buzzer

; Unit tests of the DSP library on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
